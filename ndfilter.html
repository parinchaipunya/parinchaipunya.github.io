<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ND Filter Shutter Speed Calculator</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
        }
        h1 { font-size: 1.5rem; margin-bottom: 20px; text-align: center; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { background-color: #0056b3; }
        #result {
            margin-top: 20px;
            padding: 15px;
            background: #e9ecef;
            border-radius: 6px;
            text-align: center;
            font-size: 1.3rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>ND Filter Calculator</h1>
    
    <div class="input-group">
        <label for="shutterSpeed">Base shutter speed:</label>
        <input type="text" id="shutterSpeed" placeholder="e.g., 1/1000, 1/125, 0.4, or 8">
    </div>
    
    <div class="input-group">
        <label for="ndStops">ND filter strength (Stops):</label>
        <input type="number" id="ndStops" placeholder="e.g., 10 or 15" step="0.33" min="0">
    </div>
    
    <button onclick="calculateCompensation()">Calculate compensation</button>
    
    <div id="result" style="display: none;"></div>
</div>

<script>
// Comprehensive list of standard 1/3-stop camera speeds from 1/8000s up to 60m
const standardSpeeds = [
    // Fractions of a second
    "1/8000", "1/6400", "1/5000", "1/4000", "1/3200", "1/2500", "1/2000", "1/1600", "1/1250",
    "1/1000", "1/800", "1/640", "1/500", "1/400", "1/320", "1/250", "1/200", "1/160",
    "1/125", "1/100", "1/80", "1/60", "1/50", "1/40", "1/30", "1/25", "1/20",
    "1/15", "1/13", "1/10", "1/8", "1/6", "1/5", "1/4", "1/3", "0.4", "0.5", "0.6", "0.8",
    // Seconds
    "1s", "1.3s", "1.6s", "2s", "2.5s", "3.2s", "4s", "5s", "6s", "8s", "10s", "13s", "15s", "20s", "25s", "30s",
    // Long exposure standard steps (Bulb mode equivalents in 1/3 stops)
    "40s", "50s", "1m", "1m 15s", "1m 40s", "2m", "2m 30s", "3m 15s", "4m", "5m", "6m 30s", "8m", 
    "10m", "13m", "15m", "20m", "25m", "30m", "40m", "50m", "60m"
];

// Helper to check for variations in user input style and normalize them to match our array entries
function normalizeInput(input) {
    let clean = input.trim().toLowerCase().replace(/s$/, ""); // strip out 's' if typed (e.g. 8s -> 8)
    
    // Normalize simple fractions if typed with spaces
    clean = clean.replace(/\s+/g, "");

    // If they typed something like "1", match it with our array style "1s"
    if (clean === "1") return "1s";
    
    // Check if it matches exactly as a string or needs a suffix
    for (let speed of standardSpeeds) {
        if (speed === clean || speed === clean + "s") {
            return speed;
        }
    }
    return null;
}

function calculateCompensation() {
    const rawInput = document.getElementById('shutterSpeed').value;
    const stops = parseFloat(document.getElementById('ndStops').value);
    const resultDiv = document.getElementById('result');
    
    resultDiv.style.display = 'block';
    resultDiv.style.color = '#333';

    // 1. Validate ND Stop Input
    if (isNaN(stops) || stops < 0) {
        resultDiv.style.color = '#dc3545';
        resultDiv.innerText = "Please enter a valid ND stop value.";
        return;
    }

    // 2. Locate the input in our strict standard array
    const normalizedSpeed = normalizeInput(rawInput);
    const currentIndex = standardSpeeds.indexOf(normalizedSpeed);

    if (currentIndex === -1) {
        resultDiv.style.color = '#dc3545';
        resultDiv.innerText = "Please input a standard shutter speed!";
        return;
    }

    // 3. Shift the index based on ND Filter Stops
    // Since our array is built in 1/3 increments, 1 full stop = 3 index shifts
    const indexShift = Math.round(stops * 3);
    const targetIndex = currentIndex + indexShift;

    // 4. Boundary Check
    if (targetIndex >= standardSpeeds.length) {
        resultDiv.style.color = '#dc3545';
        resultDiv.innerText = "Compensation longer than 60m is not supported!";
        return;
    }

    // 5. Output Result
    const finalCameraSetting = standardSpeeds[targetIndex];
    resultDiv.innerHTML = `Camera Setting: <strong>${finalCameraSetting}</strong>`;
}
</script>

</body>
</html>
