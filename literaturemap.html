<style>
  .litmap-frame {
    display: block;
    width: 100vw;
    margin-left: calc(50% - 50vw);
    height: calc(100vh - 120px);
    min-height: 600px;
    border: 0;
    border-top: 1px solid #e8e8e8;
    border-bottom: 1px solid #e8e8e8;
  }
  main.page-content:has(.litmap-frame) { padding-top: 0; }
</style>

<iframe id="litmap" class="litmap-frame" title="Literature Map"
        src="{{ '/assets/literaturemap/app.html' | relative_url }}"></iframe>

<script>
  // Pass a shared link's #query on to the embedded app.
  if (location.hash) {
    document.getElementById('litmap').src += location.hash;
  }
</script>
