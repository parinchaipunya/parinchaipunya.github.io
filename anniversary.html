<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex">
<title>Building Our Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,400&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fbf3ec;
    --bg2: #f6e2d6;
    --ink: #4a2f2a;
    --soft: #8a6a62;
    --rose: #d9536f;
    --rose-soft: #f3c4cd;
    --gold: #e0a84a;
    --card: #fffaf6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(circle at 50% 0%, var(--bg) 0%, var(--bg2) 100%);
    color: var(--ink);
    font-family: "Nunito", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    overflow: hidden;
    -webkit-user-select: none; user-select: none;
  }
  header {
    width: 100%; max-width: 520px; padding: 12px 16px 6px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  header h1 {
    font-family: "Fraunces", serif; font-weight: 600; font-size: 1.15rem; margin: 0;
  }
  .meter { flex: 1; max-width: 220px; }
  .meter-label { font-size: .75rem; color: var(--soft); text-align: right; margin-bottom: 3px; }
  .meter-bar { height: 10px; background: #fff; border-radius: 99px; overflow: hidden; box-shadow: inset 0 0 0 1px var(--rose-soft); }
  .meter-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--rose-soft), var(--rose)); border-radius: 99px; transition: width .3s ease; }
  #wrap { position: relative; width: 100%; max-width: 520px; flex: 1; min-height: 0; padding: 0 16px 16px; display: flex; flex-direction: column; }
  canvas {
    display: block; width: 100%; flex: 1; min-height: 0; touch-action: none;
    background: linear-gradient(#fff7f1, #fde9e1);
    border-radius: 22px;
    box-shadow: 0 10px 30px rgba(120, 60, 50, .15), inset 0 0 0 1px rgba(217, 83, 111, .15);
  }
  .overlay {
    position: absolute; inset: 0 16px 16px; border-radius: 22px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(251, 243, 236, .92); backdrop-filter: blur(4px);
    padding: 24px; text-align: center;
    transition: opacity .4s ease;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .card { max-width: 400px; }
  .card h2 { font-family: "Fraunces", serif; font-size: 1.9rem; margin: 0 0 6px; line-height: 1.15; }
  .card .date { color: var(--rose); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: .8rem; margin-bottom: 14px; }
  .card p { line-height: 1.55; margin: 0 0 12px; color: var(--ink); }
  .card .how { font-size: .9rem; color: var(--soft); }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; justify-content: center; font-size: .85rem; color: var(--soft); margin: 4px 0 18px; }
  button {
    font: 700 1rem "Nunito", sans-serif;
    background: var(--rose); color: #fff; border: 0; border-radius: 99px;
    padding: 12px 28px; cursor: pointer;
    box-shadow: 0 6px 16px rgba(217, 83, 111, .35);
    transition: transform .15s ease;
  }
  button:hover { transform: translateY(-2px); }
  button.ghost { background: transparent; color: var(--rose); box-shadow: none; margin-top: 6px; }
  .letter {
    background: var(--card); border-radius: 16px; padding: 22px 22px 18px;
    box-shadow: 0 8px 24px rgba(120, 60, 50, .12);
    text-align: left; font-family: "Fraunces", serif; font-size: 1.02rem; line-height: 1.6;
    max-height: 52vh; overflow-y: auto; margin-bottom: 16px;
  }
  .letter p { font-family: inherit; }
  .letter .sig { text-align: right; font-style: italic; margin-top: 8px; }
  .letter .icon { font-size: 2.6rem; text-align: center; margin-bottom: 4px; }
  .letter h3 { font-family: "Fraunces", serif; font-weight: 600; font-size: 1.35rem; text-align: center; margin: 0 0 14px; color: var(--rose); }
  .letter { min-height: 260px; transform-origin: top center; touch-action: pan-y; }
  .letter.unfold { animation: unfold .6s cubic-bezier(.2, .8, .2, 1); }
  @keyframes unfold {
    0% { transform: perspective(900px) rotateX(-80deg); opacity: 0; }
    100% { transform: perspective(900px) rotateX(0); opacity: 1; }
  }
  .dots { display: flex; gap: 7px; justify-content: center; margin-bottom: 12px; }
  .dots span { width: 8px; height: 8px; border-radius: 50%; background: var(--rose-soft); transition: background .3s, transform .3s; }
  .dots span.on { background: var(--rose); transform: scale(1.3); }
  .nav { display: flex; justify-content: space-between; align-items: center; }
  .nav button.ghost { margin-top: 0; }
  .nav button.invisible { visibility: hidden; }
  button.hidden { display: none; }
  #toast {
    position: absolute; left: 50%; top: 18px; transform: translate(-50%, -10px);
    background: var(--card); color: var(--ink); padding: 10px 16px; border-radius: 14px;
    box-shadow: 0 6px 18px rgba(120, 60, 50, .18);
    font-family: "Fraunces", serif; font-style: italic; font-size: .95rem;
    max-width: calc(100% - 64px); text-align: center;
    opacity: 0; pointer-events: none; transition: opacity .3s ease, transform .3s ease;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<header>
  <h1>Building Our Home</h1>
  <div class="meter">
    <div class="meter-label" id="meterLabel">0 / 20 pieces of home</div>
    <div class="meter-bar"><div class="meter-fill" id="meterFill"></div></div>
  </div>
</header>

<div id="wrap">
  <canvas id="game"></canvas>
  <div id="toast"></div>

  <div class="overlay" id="startScreen">
    <div class="card">
      <div class="date" id="startDate"></div>
      <h2>The day you came home</h2>
      <p id="startGreeting"></p>
      <p class="how">Slide the basket to catch the little things that make a house our home. Fill it with 20 pieces to open what's waiting for you.</p>
      <div class="legend">
        <span>🍵 📚 🍬 🍦 🎬 👟 catch</span>
        <span>🌧️ rain clouds slow us down</span>
      </div>
      <button id="startBtn">Let's begin</button>
    </div>
  </div>

  <div class="overlay hidden" id="endScreen">
    <div class="card">
      <div class="letter" id="letter"></div>
      <div class="dots" id="dots"></div>
      <div class="nav">
        <button id="prevBtn" class="ghost">‹ Back</button>
        <button id="nextBtn">Next ›</button>
      </div>
      <button id="againBtn" class="ghost hidden">Play again</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   Personalise here
   ============================================================ */
const CONFIG = {
  herName: "Ping",             // Printaporn Sanguansuttigul
  fromName: "Parin",
  // The day you started living together (year, month 1-12, day).
  // Set the year to show how many days you've shared a home.
  startYear: 2023,
  startMonth: 11,
  startDay: 12,
  goal: 20,
  // Little memories that pop up as she fills the house. Replace with your own!
  memories: [
    "Remember carrying in that very first box?",
    "All the matcha we have sipped together 🍵",
    "The first time 'home' meant the two of us.",
    "Movie nights curled up on the sofa 🎬",
    "Ice cream runs that were never really about the ice cream 🍦",
    "Lazy weekends that felt like forever.",
    "Almost there… just like us, always getting there together.",
  ],
  // The pages that unfold after she wins. Each page: an icon, a title,
  // and paragraphs. {name} becomes herName, {years}/{days} the time together.
  pages: [
    {
      icon: "🏡",
      title: "Happy anniversary, {name}",
      text: [
        "Three years ago today, two lives, a few boxes and a lot of hope moved in under one roof.",
        "Somewhere between unpacking and settling in, a house quietly became our home. Turn the page; I have a few things I want to tell you.",
      ],
    },
    {
      icon: "🍵",
      title: "Slow mornings",
      text: [
        "You taught me that the best days begin slowly, with a bowl of matcha and you across the table.",
        "Some of my favourite moments are those small, quiet ones that nobody else sees.",
      ],
    },
    {
      icon: "📚",
      title: "Our favourite chapters",
      text: [
        "Every day with you feels like a new page in the best story I have ever read.",
        "I never want to skip ahead. I just want to keep reading every page of our lives together.",
      ],
    },
    {
      icon: "🍦",
      title: "A little sweeter",
      text: [
        "Sweets, ice cream, a treat after a long day, you always find a way to make life a little sweeter.",
        "But honestly, nothing in the freezer or the candy jar comes close to you.",
      ],
    },
    {
      icon: "🎬",
      title: "Movie nights",
      text: [
        "We've watched so many stories together, the funny ones, the sad ones, the ones we argued about afterwards.",
        "The best part was never the film. It was you, right there next to me.",
      ],
    },
    {
      icon: "👟",
      title: "Side by side",
      text: [
        "Whether it's a morning run or the long road ahead of us, I want to keep running together, side by side, through sun and rain.",
        "However long the road, we always make it to the finish together.",
      ],
    },
    {
      icon: "💗",
      title: "{years} years, {days} days",
      text: [
        "Thank you for every ordinary day you have made extraordinary, and for making wherever we are feel like home.",
        "Here's to every day we've shared under one roof, and to all the ones still ahead of us.",
        "I love you, {name}. Happy anniversary.",
      ],
      final: true,
    },
  ],
  signoff: "With all my love,",
};
/* ============================================================ */

const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const $ = (id) => document.getElementById(id);
const canvas = $("game"), ctx = canvas.getContext("2d");

$("startDate").textContent = `${MONTHS[CONFIG.startMonth - 1]} ${CONFIG.startDay}` + (CONFIG.startYear ? `, ${CONFIG.startYear}` : "");
$("startGreeting").textContent = `Happy anniversary, ${CONFIG.herName}. This little game is for you. 💗`;

const GOOD = ["🍵", "📚", "🍬", "🍦", "🎬", "👟"];
const BAD = "🌧️";

let W = 0, H = 0, dpr = 1;
function resize() {
  const r = canvas.getBoundingClientRect();
  dpr = window.devicePixelRatio || 1;
  W = r.width; H = r.height;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  basket.y = H - 46;
  basket.x = Math.min(Math.max(basket.x || W / 2, basket.w / 2), W - basket.w / 2);
}

const basket = { x: 0, y: 0, w: 92, h: 38, targetX: null };
let items = [], particles = [], score = 0, running = false, spawnTimer = 0, elapsed = 0;
let shake = 0, memoryIdx = 0, lastTime = 0, keys = {};

function reset() {
  items = []; particles = []; score = 0; spawnTimer = 0; elapsed = 0; memoryIdx = 0; shake = 0;
  basket.x = W / 2; basket.targetX = null;
  updateMeter();
}

function updateMeter() {
  $("meterFill").style.width = `${(score / CONFIG.goal) * 100}%`;
  $("meterLabel").textContent = `${score} / ${CONFIG.goal} pieces of home`;
}

let toastTimer;
function toast(text, ms = 2600) {
  const t = $("toast");
  t.textContent = text; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), ms);
}

function spawn() {
  const difficulty = Math.min(elapsed / 40, 1);
  const bad = Math.random() < 0.14 + difficulty * 0.1;
  items.push({
    x: 24 + Math.random() * (W - 48),
    y: -30,
    vy: 1.6 + Math.random() * 1.2 + difficulty * 1.6,
    sway: Math.random() * Math.PI * 2,
    emoji: bad ? BAD : GOOD[Math.floor(Math.random() * GOOD.length)],
    bad,
    size: bad ? 34 : 30,
    rot: (Math.random() - 0.5) * 0.4,
  });
}

function burst(x, y, color, n = 12, glyph = null) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 1 + Math.random() * 3;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 2, life: 1, color, glyph, size: 4 + Math.random() * 4 });
  }
}

function catchItem(it) {
  if (it.bad) {
    score = Math.max(0, score - 2);
    shake = 10;
    burst(it.x, it.y, "#9fb3c8", 14);
    toast("Every storm passes. We weather it together. ☔", 2200);
  } else {
    score++;
    burst(it.x, it.y, "#d9536f", 10, Math.random() < 0.4 ? "♥" : null);
    const step = Math.floor(CONFIG.goal / (CONFIG.memories.length + 1));
    if (score >= step * (memoryIdx + 1) && memoryIdx < CONFIG.memories.length) {
      toast(CONFIG.memories[memoryIdx++]);
    }
  }
  updateMeter();
  if (score >= CONFIG.goal) win();
}

function update(dt) {
  elapsed += dt / 60;
  // input
  const speed = 9 * dt;
  if (keys.ArrowLeft || keys.a) { basket.x -= speed; basket.targetX = null; }
  if (keys.ArrowRight || keys.d) { basket.x += speed; basket.targetX = null; }
  if (basket.targetX !== null) basket.x += (basket.targetX - basket.x) * Math.min(1, 0.35 * dt);
  basket.x = Math.min(Math.max(basket.x, basket.w / 2), W - basket.w / 2);

  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    spawn();
    spawnTimer = Math.max(22, 48 - elapsed * 0.6) + Math.random() * 18;
  }

  for (const it of items) {
    it.y += it.vy * dt;
    it.sway += 0.04 * dt;
    it.x += Math.sin(it.sway) * 0.5 * dt;
    const top = basket.y - basket.h / 2;
    if (!it.caught && it.y + it.size / 2 >= top && it.y < basket.y + 6 &&
        Math.abs(it.x - basket.x) < basket.w / 2 + 6) {
      it.caught = true;
      catchItem(it);
    }
  }
  items = items.filter((it) => !it.caught && it.y < H + 40);

  for (const p of particles) {
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 0.15 * dt; p.life -= 0.025 * dt;
  }
  particles = particles.filter((p) => p.life > 0);
  if (shake > 0) shake = Math.max(0, shake - dt);
}

function drawBasket() {
  const { x, y, w, h } = basket;
  ctx.save();
  ctx.translate(x, y);
  // shadow
  ctx.fillStyle = "rgba(120,60,50,.12)";
  ctx.beginPath(); ctx.ellipse(0, h / 2 + 8, w / 2, 6, 0, 0, Math.PI * 2); ctx.fill();
  // body
  const g = ctx.createLinearGradient(0, -h / 2, 0, h / 2);
  g.addColorStop(0, "#e9b78a"); g.addColorStop(1, "#c98b5c");
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(-w / 2, -h / 2);
  ctx.lineTo(w / 2, -h / 2);
  ctx.lineTo(w / 2 - 10, h / 2);
  ctx.quadraticCurveTo(0, h / 2 + 6, -w / 2 + 10, h / 2);
  ctx.closePath(); ctx.fill();
  // weave lines
  ctx.strokeStyle = "rgba(120,70,40,.25)"; ctx.lineWidth = 2;
  for (let i = -2; i <= 2; i++) {
    ctx.beginPath(); ctx.moveTo(i * 16, -h / 2 + 3); ctx.lineTo(i * 14, h / 2 - 2); ctx.stroke();
  }
  // rim
  ctx.fillStyle = "#b5764a";
  ctx.beginPath(); ctx.roundRect(-w / 2 - 4, -h / 2 - 5, w + 8, 9, 5); ctx.fill();
  // heart
  ctx.fillStyle = "#d9536f";
  ctx.font = "18px serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText("♥", 0, 4);
  ctx.restore();
}

function drawBackground() {
  // soft window light + little skyline of a house on the horizon
  ctx.fillStyle = "rgba(217,83,111,.06)";
  const t = performance.now() / 4000;
  for (let i = 0; i < 6; i++) {
    const x = ((i * 97 + t * 30) % (W + 60)) - 30;
    const y = 40 + (i * 53) % (H * 0.5);
    ctx.font = `${18 + (i % 3) * 6}px serif`;
    ctx.fillText("♥", x, y);
  }
  ctx.fillStyle = "rgba(201,139,92,.18)";
  ctx.fillRect(0, H - 14, W, 14);
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  drawBackground();

  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  for (const it of items) {
    ctx.save();
    ctx.translate(it.x, it.y); ctx.rotate(it.rot + Math.sin(it.sway) * 0.15);
    ctx.font = `${it.size}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
    ctx.fillText(it.emoji, 0, 0);
    ctx.restore();
  }
  drawBasket();
  for (const p of particles) {
    ctx.globalAlpha = Math.max(p.life, 0);
    ctx.fillStyle = p.color;
    if (p.glyph) { ctx.font = `${p.size * 3}px serif`; ctx.fillText(p.glyph, p.x, p.y); }
    else { ctx.beginPath(); ctx.arc(p.x, p.y, p.size / 2, 0, Math.PI * 2); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

function loop(now) {
  const dt = Math.min((now - lastTime) / (1000 / 60), 3);
  lastTime = now;
  if (running) update(dt);
  draw();
  requestAnimationFrame(loop);
}

// ---- Ending ----
function daysTogether() {
  if (!CONFIG.startYear) return null;
  const start = new Date(CONFIG.startYear, CONFIG.startMonth - 1, CONFIG.startDay);
  const now = new Date(); now.setHours(0, 0, 0, 0);
  const days = Math.round((now - start) / 86400000);
  let years = now.getFullYear() - CONFIG.startYear;
  if (now < new Date(now.getFullYear(), CONFIG.startMonth - 1, CONFIG.startDay)) years--;
  return { days, years };
}

let confettiTimer;
function win() {
  running = false;
  items = [];
  $("dots").innerHTML = CONFIG.pages.map(() => "<span></span>").join("");
  showPage(0);
  $("endScreen").classList.remove("hidden");
  let n = 0;
  clearInterval(confettiTimer);
  confettiTimer = setInterval(() => {
    burst(Math.random() * W, Math.random() * H * 0.5, ["#d9536f", "#e0a84a", "#f3c4cd"][n % 3], 14, "♥");
    if (++n > 24) clearInterval(confettiTimer);
  }, 180);
}

// ---- Unfolding pages ----
let page = 0;
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function fill(s) {
  const d = daysTogether();
  return s
    .replaceAll("{name}", CONFIG.herName)
    .replaceAll("{years}", d ? String(d.years) : "")
    .replaceAll("{days}", d ? d.days.toLocaleString() : "");
}
function showPage(i) {
  page = Math.max(0, Math.min(i, CONFIG.pages.length - 1));
  const p = CONFIG.pages[page];
  const L = $("letter");
  L.innerHTML =
    `<div class="icon">${p.icon}</div><h3>${esc(fill(p.title))}</h3>` +
    p.text.map((t) => `<p>${esc(fill(t))}</p>`).join("") +
    (p.final ? `<p class="sig">${esc(CONFIG.signoff)}<br>${esc(CONFIG.fromName)} ♥</p>` : "");
  L.scrollTop = 0;
  L.classList.remove("unfold"); void L.offsetWidth; L.classList.add("unfold");
  [...$("dots").children].forEach((s, k) => s.classList.toggle("on", k === page));
  const last = page === CONFIG.pages.length - 1;
  $("prevBtn").classList.toggle("invisible", page === 0);
  $("nextBtn").classList.toggle("invisible", last);
  $("againBtn").classList.toggle("hidden", !last);
  if (last) burst(W / 2, H * 0.3, "#d9536f", 30, "♥");
}
$("prevBtn").addEventListener("click", () => showPage(page - 1));
$("nextBtn").addEventListener("click", () => showPage(page + 1));
window.addEventListener("keydown", (e) => {
  if ($("endScreen").classList.contains("hidden")) return;
  if (e.key === "ArrowRight") showPage(page + 1);
  if (e.key === "ArrowLeft") showPage(page - 1);
});

function start() {
  resize(); reset();
  $("startScreen").classList.add("hidden");
  $("endScreen").classList.add("hidden");
  running = true;
  setTimeout(() => toast(`Welcome home, ${CONFIG.herName} 🏡`), 400);
}

// ---- Input ----
function pointerX(e) {
  const r = canvas.getBoundingClientRect();
  return (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
}
canvas.addEventListener("pointermove", (e) => { basket.targetX = pointerX(e); });
canvas.addEventListener("pointerdown", (e) => { basket.targetX = pointerX(e); });
canvas.addEventListener("touchmove", (e) => { basket.targetX = pointerX(e); e.preventDefault(); }, { passive: false });
window.addEventListener("keydown", (e) => { keys[e.key] = true; });
window.addEventListener("keyup", (e) => { keys[e.key] = false; });
window.addEventListener("resize", resize);

$("startBtn").addEventListener("click", start);
$("againBtn").addEventListener("click", start);

resize();
requestAnimationFrame((t) => { lastTime = t; loop(t); });
</script>
</body>
</html>
